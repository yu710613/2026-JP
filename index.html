            --morandi-purple: #b3a5b8; /* 藕紫 */
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .serif { font-family: 'Noto Serif JP', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 列表卡片 */
        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.1s ease;
            position: relative;
            border: 1px solid #f5f5f0;
        }
        .event-card:active { transform: scale(0.98); background-color: #fafaf9; }

        /* 天氣捲軸遮罩 */
        .weather-scroll {
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }

        /* 時間軸線條 */
        .timeline-line {
            position: absolute;
            left: 24px;
            top: 48px;
            bottom: -24px;
            width: 1px;
            background-color: #d6d3d1;
            z-index: 0;
        }
        .last-item .timeline-line { display: none; }

        /* 彈窗動畫 */
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .modal-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 莫蘭迪高亮樣式 */
        .hl-rose { color: #9d5b6e; font-weight: 700; background-color: #f4e9ec; padding: 0 4px; border-radius: 4px; margin: 0 2px; }
        .hl-blue { color: #5f7285; font-weight: 700; background-color: #e6eef5; padding: 0 4px; border-radius: 4px; margin: 0 2px; }
        .hl-yellow { color: #9c8456; font-weight: 700; background-color: #f7f2e6; padding: 0 4px; border-radius: 4px; margin: 0 2px; }
        
        /* Checkbox Custom */
        .custom-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #d6d3d1;
            border-radius: 4px;
            margin-right: 8px;
            position: relative;
            cursor: pointer;
        }
        .custom-checkbox:checked {
            background-color: #9cad95;
            border-color: #9cad95;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

                                let icon = "sun";

                                if (code >= 51) icon = "rain";
                                const hourNum = parseInt(timeStr.split(':')[0]);
                                if ((hourNum >= 18 || hourNum <= 5) && icon === "sun") icon = "moon";
                                next24.push({ time: timeStr, temp: Math.round(hourly.temperature_2m[idx]), icon: icon });
                            }
                        }
                        setHourlyForecast(next24);

                        const rateRes = await axios.get('https://api.exchangerate-api.com/v4/latest/JPY');
                        if (rateRes.data && rateRes.data.rates && rateRes.data.rates.TWD) {
                            setExchangeRate(rateRes.data.rates.TWD);
                        }

                    } catch (error) {
                        console.error("API fetch failed", error);
                        setCurrentTemp("10°C");
                        setCurrentCondition("Cloudy");
                        setHourlyForecast(generateHourlyWeather("Cloudy"));
                    }
                };
                fetchData();
            }, [selectedDay]);

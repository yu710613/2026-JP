<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>京阪行 | Travel Mate</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f9f9f7; /* 和紙白 */
            color: #2d3748;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏滾動條但保持功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 模擬數據 (根據你的PDF提取並優化) ---
        const itineraryData = {
            "Day 1": {
                date: "12/31 (Sun)",
                location: "大阪 Umeda",
                weather: "晴時多雲 8°C",
                events: [
                    [span_0](start_span){ time: "14:55", type: "transport", title: "抵達 & Check-in", desc: "前往 Hotel Vista Premio[span_0](end_span)", icon: "plane" },
                    { time: "15:30", type: "shop", title: "LUCUA 1100", desc: "大阪必逛百貨，文青雜貨與服飾", tips: ["必買: 日系女裝", "攻略: 9F 蔦屋書店"], icon: "shopping-bag", nav: "LUCUA 1100" },
                    [span_1](start_span){ time: "19:10", type: "food", title: "晚餐 / 逛街", desc: "HEP FIVE / Yodobashi Camera[span_1](end_span)", tips: ["必看: 紅色摩天輪"], icon: "utensils", nav: "HEP FIVE" },
                    { time: "21:00", type: "sight", title: "Sauna / 休息", desc: "行程結束，準備明日體力", icon: "moon" }
                ]
            },
            "Day 2": {
                date: "1/1 (Mon)",
                location: "大阪 Namba/Shinsaibashi",
                weather: "晴朗 6°C",
                events: [
                    [span_2](start_span){ time: "08:30", type: "sight", title: "八阪神社", desc: "著名的巨大獅子頭神社[span_2](end_span)", tips: ["攻略: 這裡求財運與學業", "拍照: 獅子口中合影"], icon: "camera", nav: "Namba Yasaka Shrine" },
                    [span_3](start_span){ time: "11:15", type: "food", title: "黑門市場", desc: "大阪的廚房[span_3](end_span)", tips: ["必吃: 黑鮪魚大腹", "必吃: 炭烤扇貝", "注意: 僅收現金店鋪多"], icon: "utensils", nav: "Kuromon Ichiba Market" },
                    [span_4](start_span){ time: "14:15", type: "shop", title: "心齋橋 & PARCO", desc: "Human Made, Pop Mart[span_4](end_span)", tips: ["必買: Human Made 限定T恤", "攻略: PARCO 6F 動漫層"], icon: "shopping-bag", nav: "Shinsaibashi Parco" },
                    [span_5](start_span){ time: "17:00", type: "sight", title: "道頓堀", desc: "跑跑人看板 (Glico Man)[span_5](end_span)", tips: ["拍照: 雙手舉高姿勢"], icon: "camera", nav: "Dotonbori Glico Sign" }
                ]
            },
            "Day 3": {
                date: "1/2 (Tue)",
                location: "京都 Kyoto",
                weather: "多雲 5°C",
                events: [
                    { time: "09:00", type: "transport", title: "移動至京都", desc: "搭乘京阪電車或JR", icon: "train" },
                    { time: "10:30", type: "sight", title: "清水寺 & 二三年坂", desc: "世界文化遺產", tips: ["攻略: 早起避開人潮"], icon: "camera", nav: "Kiyomizu-dera" },
                    [span_6](start_span){ time: "13:00", type: "food", title: "Malebranche", desc: "京都北山[span_6](end_span)", tips: ["必買伴手禮: 茶之菓 (Cha no Ka)", "必吃: 抹茶冰淇淋"], icon: "gift", nav: "Malebranche Kyoto Tower Sando" },
                    [span_7](start_span){ time: "14:30", type: "sight", title: "新白川 / 祇園", desc: "傳統藝伎區散步[span_7](end_span)", icon: "map-pin", nav: "Gion Shirakawa" }
                ]
            }
        };

        const hotelInfo = {
            name: "Hotel Vista Premio",
            address: "〒541-0041 大阪府大阪市... (Source: PDF)", // 根據 PDF 補充
            checkin: "15:00",
            checkout: "11:00",
            emergency: "110 (警察) / 119 (救護)",
            notes: "訂房編號: 1212xyz (範例)"
        };

        const budgetData = [
            { item: "機票", cost: 12000, paid: true },
            { item: "住宿", cost: 8000, paid: true },
            { item: "交通卡儲值", cost: 3000, paid: false },
            { item: "預計餐費", cost: 15000, paid: false },
        ];

        // --- 組件 ---

        const WeatherBadge = ({ weather }) => (
            <div className="flex items-center space-x-1 bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-medium border border-blue-100">
                <i data-lucide="cloud-sun" className="w-3 h-3"></i>
                <span>{weather}</span>
            </div>
        );

        const Tag = ({ text, type }) => {
            let colorClass = "bg-gray-100 text-gray-600";
            if (text.includes("必吃")) colorClass = "bg-orange-100 text-orange-700 border-orange-200";
            if (text.includes("必買")) colorClass = "bg-red-100 text-red-700 border-red-200";
            if (text.includes("攻略") || text.includes("注意")) colorClass = "bg-indigo-100 text-indigo-700 border-indigo-200";
            
            return (
                <span className={`inline-block px-2 py-0.5 rounded text-[10px] mr-1 mb-1 border ${colorClass}`}>
                    {text}
                </span>
            );
        };

        const ActionButton = ({ icon, label, onClick, primary }) => (
            <button 
                onClick={onClick}
                className={`flex items-center justify-center space-x-1 py-2 px-3 rounded-lg text-sm transition-all duration-200 ${primary ? 'bg-gray-800 text-white shadow-md active:scale-95' : 'bg-white text-gray-600 border border-gray-200 shadow-sm active:bg-gray-50'}`}
            >
                <i data-lucide={icon} className="w-4 h-4"></i>
                <span>{label}</span>
            </button>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDay, setSelectedDay] = useState('Day 1');

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, selectedDay]);

            const openMap = (location) => {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`, '_blank');
            };

            const renderItinerary = () => (
                <div className="pb-24">
                    {/* Date Selector */}
                    <div className="sticky top-0 z-10 bg-[#f9f9f7]/95 backdrop-blur pt-2 pb-4 px-4 flex space-x-3 overflow-x-auto hide-scrollbar border-b border-gray-200/50">
                        {Object.keys(itineraryData).map(day => (
                            <button 
                                key={day}
                                onClick={() => setSelectedDay(day)}
                                className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium transition-all ${selectedDay === day ? 'bg-gray-800 text-white shadow-lg transform scale-105' : 'bg-white text-gray-400 border border-gray-100'}`}
                            >
                                <span className="block text-xs opacity-70">{day}</span>
                                <span>{itineraryData[day].date.split(' ')[0]}</span>
                            </button>
                        ))}
                    </div>

                    {/* Day Header */}
                    <div className="px-5 mt-6 mb-4 flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">{itineraryData[selectedDay].location}</h2>
                            <p className="text-sm text-gray-400 mt-1">{itineraryData[selectedDay].date}</p>
                        </div>
                        <WeatherBadge weather={itineraryData[selectedDay].weather} />
                    </div>

                    {/* Timeline */}
                    <div className="px-4 space-y-4">
                        {itineraryData[selectedDay].events.map((event, index) => (
                            <div key={index} className="glass-card p-4 rounded-xl relative overflow-hidden">
                                {/* Type Indicator Strip */}
                                <div className={`absolute left-0 top-0 bottom-0 w-1 ${
                                    event.type === 'food' ? 'bg-orange-400' : 
                                    event.type === 'shop' ? 'bg-red-400' : 
                                    event.type === 'transport' ? 'bg-blue-400' : 'bg-green-600'
                                }`}></div>

                                <div className="pl-3">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded">{event.time}</span>
                                            <h3 className="font-bold text-lg text-gray-800">{event.title}</h3>
                                        </div>
                                    </div>
                                    
                                    <p className="text-sm text-gray-500 mb-3 leading-relaxed">{event.desc}</p>
                                    
                                    {/* Tips Tags */}
                                    {event.tips && (
                                        <div className="flex flex-wrap mb-3">
                                            {event.tips.map((tip, i) => <Tag key={i} text={tip} />)}
                                        </div>
                                    )}

                                    {/* Action Buttons */}
                                    {event.nav && (
                                        <div className="flex space-x-2 mt-2">
                                            <ActionButton 
                                                icon="map-pin" 
                                                label="導航" 
                                                primary={true} 
                                                onClick={() => openMap(event.nav)} 
                                            />
                                            <ActionButton 
                                                icon="search" 
                                                label="攻略" 
                                                onClick={() => window.open(`https://www.google.com/search?q=${encodeURIComponent(event.title + " 攻略")}`, '_blank')} 
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderInfo = () => (
                <div className="p-5 pb-24 space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">旅程資訊</h2>
                    
                    {/* Accommodation Card */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex items-center space-x-2 mb-3 text-indigo-900">
                            <i data-lucide="hotel" className="w-5 h-5"></i>
                            <h3 className="font-bold text-lg">住宿資訊</h3>
                        </div>
                        <div className="space-y-3">
                            <div>
                                <label className="text-xs text-gray-400 uppercase tracking-wider">Hotel Name</label>
                                <p className="font-medium text-gray-800">{hotelInfo.name}</p>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs text-gray-400 uppercase tracking-wider">Check-in</label>
                                    <p className="font-medium text-gray-800">{hotelInfo.checkin}</p>
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 uppercase tracking-wider">Check-out</label>
                                    <p className="font-medium text-gray-800">{hotelInfo.checkout}</p>
                                </div>
                            </div>
                            <div className="bg-gray-50 p-3 rounded text-sm text-gray-600 mt-2">
                                {hotelInfo.address}
                            </div>
                            <ActionButton 
                                icon="map" 
                                label="導航至飯店" 
                                primary={true}
                                onClick={() => openMap(hotelInfo.name)} 
                            />
                        </div>
                    </div>

                     {/* Emergency Card */}
                     <div className="bg-red-50 p-5 rounded-xl border border-red-100">
                        <div className="flex items-center space-x-2 mb-3 text-red-800">
                            <i data-lucide="phone-call" className="w-5 h-5"></i>
                            <h3 className="font-bold text-lg">緊急聯絡</h3>
                        </div>
                        <p className="text-red-700 font-medium text-lg">{hotelInfo.emergency}</p>
                        <p className="text-xs text-red-400 mt-1">外交部旅外國人急難救助專線: 0800-085-095</p>
                    </div>

                    {/* Budget Card */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                         <div className="flex items-center space-x-2 mb-3 text-green-700">
                            <i data-lucide="wallet" className="w-5 h-5"></i>
                            <h3 className="font-bold text-lg">預算概覽</h3>
                        </div>
                        <div className="divide-y divide-gray-100">
                            {budgetData.map((item, i) => (
                                <div key={i} className="py-3 flex justify-between items-center">
                                    <span className={item.paid ? "text-gray-400 line-through" : "text-gray-700"}>{item.item}</span>
                                    <span className={`font-mono ${item.paid ? "text-gray-400" : "text-gray-800 font-bold"}`}>
                                        NT$ {item.cost.toLocaleString()}
                                    </span>
                                </div>
                            ))}
                        </div>
                        <div className="mt-4 pt-3 border-t border-dashed border-gray-200 flex justify-between items-center">
                            <span className="text-sm text-gray-500">總預算</span>
                            <span className="text-xl font-bold text-gray-800">
                                NT$ {budgetData.reduce((acc, cur) => acc + cur.cost, 0).toLocaleString()}
                            </span>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#f9f9f7]">
                    {activeTab === 'itinerary' ? renderItinerary() : renderInfo()}

                    {/* Bottom Navigation */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-2 px-6 flex justify-around items-center z-50 h-20 shadow-[0_-5px_15px_rgba(0,0,0,0.03)]">
                        <button 
                            onClick={() => setActiveTab('itinerary')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'itinerary' ? 'text-gray-900' : 'text-gray-400'}`}
                        >
                            <i data-lucide="map" className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium tracking-wide">行程</span>
                        </button>
                        
                        <div className="w-px h-8 bg-gray-100"></div>

                        <button 
                            onClick={() => setActiveTab('info')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'info' ? 'text-gray-900' : 'text-gray-400'}`}
                        >
                            <i data-lucide="briefcase" className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium tracking-wide">資訊 & 預算</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

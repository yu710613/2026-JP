        /* 列表卡片 */
        .event-card {
            background: #ffffff;

            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            transition: transform 0.1s ease;
            position: relative;
            border: 1px solid white;
        }
        .event-card:active { transform: scale(0.98); background-color: #fafaf9; }

        /* 時間軸 */
        .timeline-line {
            position: absolute;
            left: 24px;
            top: 48px;
            bottom: -24px;
            width: 2px;
            background-color: #e7e5e4;
            z-index: 0;
        }
        .last-item .timeline-line { display: none; }

        /* 彈窗動畫 (Bottom Sheet) */
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .modal-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* 高亮樣式 */
        .hl-red { color: #dc2626; font-weight: 700; background-color: #fecaca; padding: 0 4px; border-radius: 4px; margin: 0 2px; }
        .hl-blue { color: #2563eb; font-weight: 700; background-color: #dbeafe; padding: 0 4px; border-radius: 4px; margin: 0 2px; }
        .hl-amber { color: #d97706; font-weight: 700; background-color: #fef3c7; padding: 0 4px; border-radius: 4px; margin: 0 2px; }

                                        }`}
                                    >
                                        <span className="text-[10px] uppercase font-bold tracking-wider">{itineraryData[day].weekday}</span>
                                        <span className="text-lg font-serif leading-none mt-1">{itineraryData[day].date.split('/')[1]}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Weather Summary */}
                        <div className="px-5 mt-6 mb-2">
                            <div className="flex items-center justify-between text-gray-500 text-xs font-medium bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm">
                                <div className="flex items-center">
                                    <i data-lucide="map-pin" className="w-3 h-3 mr-1"></i>
                                    {currentData.area}
                                </div>
                                <div className="flex items-center">
                                    <span className="mr-2">{currentData.condition}</span>
                                    <span className="font-bold text-gray-800">{currentData.temp}</span>
                                </div>
                            </div>
                        </div>

                        {/* Event List */}
                        <div className="px-5 mt-6 space-y-4 relative">
                             {currentData.events.map((event, index) => {
                                 const isLast = index === currentData.events.length - 1;
                                 let iconName = 'info';
                                 let accentColor = "bg-gray-400";
                                 let dotColor = "border-gray-300";
                                 
                                 if (event.type === 'food') { iconName='utensils'; accentColor = "bg-orange-500"; dotColor = "border-orange-400"; }
                                 if (event.type === 'shop') { iconName='shopping-bag'; accentColor = "bg-rose-500"; dotColor = "border-rose-400"; }
                                 if (event.type === 'transport') { iconName='train'; accentColor = "bg-blue-500"; dotColor = "border-blue-400"; }
                                 if (event.type === 'hotel') { iconName='bed-double'; accentColor = "bg-purple-500"; dotColor = "border-purple-400"; }
                                 if (event.type === 'sight') { iconName='camera'; accentColor = "bg-emerald-500"; dotColor = "border-emerald-400"; }

                                 return (
                                    <div key={index} className={`relative pl-12 ${isLast ? 'last-item' : ''}`}>
                                        <div className="timeline-line"></div>
                                        
                                        {/* Timeline Dot */}
                                        <div className="absolute left-0 top-6 flex flex-col items-center z-10 w-12 text-center">
                                            <span className="text-[10px] font-mono font-bold text-gray-400 mb-1 block">{event.time}</span>
                                            <div className={`w-3 h-3 rounded-full border-2 bg-white ${dotColor}`}></div>
                                        </div>

                                        <div 
                                            className="event-card p-4 cursor-pointer"
                                            onClick={() => setSelectedEvent({...event, accentColor, iconName})}
                                        >
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1 pr-4">
                                                    <div className="flex items-center space-x-2 mb-1">
                                                        <span className={`text-[9px] font-bold text-white px-2 py-0.5 rounded-full ${accentColor}`}>
                                                            {event.type.toUpperCase()}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-base font-bold text-gray-800 serif leading-tight mb-1">
                                                        {event.title}
                                                    </h3>
                                                    <p className="text-xs text-gray-400 flex items-center truncate">
                                                        {event.address}
                                                    </p>
                                                </div>
                                                <div className="text-gray-300 mt-2">
                                                    <i data-lucide="chevron-right" className="w-5 h-5"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                 );
                             })}
                        </div>

                        {/* Modal Popup */}
                        {selectedEvent && (
                            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
                                <div 
                                    className="absolute inset-0 bg-black/30 backdrop-blur-[2px] transition-opacity"
                                    onClick={() => setSelectedEvent(null)}
                                ></div>
                                
                                <div className="modal-content modal-enter relative bg-white w-full sm:max-w-md h-[80vh] sm:h-auto sm:max-h-[85vh] shadow-2xl overflow-hidden flex flex-col">
                                    
                                    {/* Modal Header */}
                                    <div className="p-6 pb-4 bg-white z-10 border-b border-gray-100">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex items-center space-x-2">
                                                <span className={`text-[10px] font-bold text-white px-2 py-0.5 rounded-full ${selectedEvent.accentColor}`}>
                                                    {selectedEvent.type.toUpperCase()}
                                                </span>
                                                <span className="text-sm font-mono font-bold text-gray-500">{selectedEvent.time}</span>
                                            </div>
                                            <button onClick={() => setSelectedEvent(null)} className="bg-gray-50 rounded-full p-2 text-gray-400 hover:bg-gray-100">
                                                <i data-lucide="x" className="w-5 h-5"></i>
                                            </button>
                                        </div>
                                        <h2 className="text-2xl font-serif font-bold text-gray-800 leading-tight mb-2">
                                            {selectedEvent.title}
                                        </h2>
                                        <div className="flex items-start text-xs text-gray-500 bg-gray-50 p-2 rounded-lg">
                                            <i data-lucide="map-pin" className="w-3 h-3 mr-2 mt-0.5 flex-shrink-0"></i>
                                            <span className="leading-relaxed">{selectedEvent.address}</span>
                                        </div>
                                    </div>

                                    {/* Modal Body */}
                                    <div className="flex-1 overflow-y-auto p-6 bg-white space-y-8">
                                        
                                        {/* Guide Note */}
                                        {selectedEvent.guide && (
                                            <div>
                                                <div className="flex items-center space-x-2 mb-3">
                                                    <i data-lucide="book-open" className="w-4 h-4 text-gray-400"></i>
                                                    <h3 className="font-bold text-gray-800 text-sm tracking-wide">導遊筆記 GUIDE NOTE</h3>
                                                </div>
                                                <ul className="space-y-3 pl-1">
                                                    {selectedEvent.guide.map((note, i) => (
                                                        <li key={i} className="flex items-start text-sm text-gray-600 leading-7">
                                                            <span className="text-gray-300 mr-3 mt-1.5 text-[8px]">●</span>
                                                            <span>{parseGuideText(note)}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        {/* About Section */}
                                        {selectedEvent.about && (
                                            <div className="bg-[#f8fafc] rounded-xl p-5 border border-gray-100">
                                                <h3 className="font-serif font-bold text-gray-700 text-sm mb-2 flex items-center">
                                                    <i data-lucide="sparkles" className="w-3 h-3 mr-2 text-purple-400"></i>
                                                    {selectedEvent.about.title}
                                                </h3>
                                                <p className="text-xs text-gray-500 leading-relaxed text-justify">
                                                    {selectedEvent.about.content}
                                                </p>
                                            </div>
                                        )}
                                        
                                        {/* Tags */}
                                        {selectedEvent.tags && (
                                            <div className="flex flex-wrap gap-2">
                                                {selectedEvent.tags.map((tag, i) => (
                                                    <span key={i} className="text-xs px-3 py-1 rounded-full border border-gray-200 text-gray-500 bg-white">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                        
                                        <div className="h-20"></div>
                                    </div>

                                    {/* Footer Button */}
                                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100">
                                        <button 
                                            onClick={() => handleNav(selectedEvent.nav)}
                                            className="w-full py-3.5 rounded-xl text-white text-sm font-bold flex items-center justify-center shadow-lg active:scale-95 transition-transform bg-gray-800"
                                        >
                                            <i data-lucide="navigation" className="w-4 h-4 mr-2"></i>
                                            開啟 Google Maps 導航
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderInfo = () => (
                <div className="px-5 py-8 pb-24 animate-fade-in">
                    <h2 className="text-xl font-serif font-bold text-gray-800 mb-6 border-b pb-2 border-gray-200">旅程資訊</h2>
                    {hotelInfos.map((hotel, i) => (
                        <div key={i} className="event-card p-5 mb-4" onClick={() => handleNav(hotel.nav)}>
                            <div className="pl-1">
                                <h3 className="serif font-bold text-base text-gray-800">{hotel.name}</h3>
                                <p className="text-xs text-gray-400 mt-1 font-mono mb-2">{hotel.date}</p>
                                <div className="text-xs text-gray-500 flex items-start">
                                    <i data-lucide="map-pin" className="w-3 h-3 mr-1 mt-0.5"></i>
                                    {hotel.address}
                                </div>
                            </div>
                        </div>
                    ))}
                    
                    <div className="grid grid-cols-2 gap-4 mt-6">
                         <div className="bg-red-50 p-4 rounded-xl flex flex-col items-center justify-center border border-red-100">
                            <i data-lucide="phone-call" className="w-6 h-6 text-red-400 mb-2"></i>
                            <span className="text-red-800 font-bold text-sm">110 / 119</span>
                            <span className="text-[10px] text-red-400 mt-1">緊急電話</span>
                        </div>
                        <div className="bg-emerald-50 p-4 rounded-xl flex flex-col items-center justify-center border border-emerald-100">
                             <a href="https://transit.yahoo.co.jp/" target="_blank" className="flex flex-col items-center">
                                <i data-lucide="train" className="w-6 h-6 text-emerald-500 mb-2"></i>
                                <span className="text-emerald-800 font-bold text-sm">換乘案內</span>
                                <span className="text-[10px] text-emerald-400 mt-1">交通查詢</span>
                            </a>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    {activeTab === 'schedule' ? renderSchedule() : renderInfo()}
                    <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-md border border-gray-200 rounded-full px-8 py-3 flex items-center shadow-xl shadow-gray-200/50 z-50 space-x-8">
                        <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center space-y-1 ${activeTab === 'schedule' ? 'text-gray-800' : 'text-gray-300'}`}>
                            <i data-lucide="calendar-days" className="w-5 h-5"></i>
                        </button>
                        <div className="w-px h-4 bg-gray-200"></div>
                        <button onClick={() => setActiveTab('info')} className={`flex flex-col items-center space-y-1 ${activeTab === 'info' ? 'text-gray-800' : 'text-gray-300'}`}>
                            <i data-lucide="info" className="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

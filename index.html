<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 京阪行 | Ultimate Trip</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 全局設定：深色模式基底 */
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* 隱藏滾動條 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 毛玻璃卡片特效 */
        .glass-card {
            background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* 霓虹漸層文字 */
        .text-gradient {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 時間軸線條 */
        .timeline-line {
            position: absolute;
            left: 27px;
            top: 40px;
            bottom: -20px;
            width: 2px;
            background: rgba(56, 189, 248, 0.2); /* Sky blue hint */
            z-index: 0;
        }
        .last-item .timeline-line { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 詳細行程資料 (1/11-1/15) ---
        const itineraryData = {
            "Day 1": { 
                date: "1/11 (Sun)", 
                area: "大阪梅田", 
                weather: "🌤 6-10°C", 
                events: [ 
                    { time: "14:55", type: "transport", title: "抵達關西機場", desc: "CX564 | 入境審查", icon: "plane", nav: "Kansai International Airport" },
                    { time: "17:00", type: "hotel", title: "Check-in: 京阪淀屋橋", desc: "放行李 | 訂好了！", icon: "hotel", nav: "Hotel Keihan Yodoyabashi", tags: ["住宿"] },
                    { time: "17:20", type: "shop", title: "阪急百貨", desc: "梅田精華區", icon: "shopping-bag", nav: "Hankyu Umeda Main Store" },
                    { time: "17:50", type: "food", title: "grenier Umeda", desc: "必吃：烤布蕾千層派", icon: "coffee", nav: "grenier Umeda", tags: ["必吃", "排隊"] },
                    { time: "18:20", type: "shop", title: "LUCUA 1100", desc: "年輕時尚百貨", icon: "shopping-bag", nav: "LUCUA 1100" },
                    { time: "19:10", type: "shop", title: "Links Umeda", desc: "友都八喜連通", icon: "shopping-bag", nav: "LINKS UMEDA" },
                    { time: "20:00", type: "shop", title: "YODOBASHI", desc: "大型電器/扭蛋", icon: "gift", nav: "Yodobashi Umeda" },
                    { time: "21:00", type: "food", title: "梅田宵夜連發", desc: "Hanadako章魚燒 / SAKURA大阪燒 / 松葉串炸", icon: "utensils", nav: "Hanadako Osaka", tags: ["必吃"] },
                    { time: "22:00", type: "shop", title: "Book Studio", desc: "書店逛逛", icon: "book", nav: "Book Studio Osaka" },
                    { time: "22:30", type: "transport", title: "回飯店休息", desc: "養精蓄銳", icon: "moon" }
                ] 
            },
            "Day 2": { 
                date: "1/12 (Mon)", 
                area: "難波心齋橋", 
                weather: "☀ 5-9°C", 
                events: [ 
                    { time: "08:20", type: "sight", title: "難波八阪神社", desc: "巨大獅子頭祈福", icon: "camera", nav: "Namba Yasaka Shrine", tags: ["必拍"] },
                    { time: "09:30", type: "food", title: "Galette au Beurre", desc: "高島屋 | 法式奶油餅乾", icon: "gift", nav: "Galette au Beurre Takashimaya Osaka", tags: ["伴手禮"] },
                    { time: "10:00", type: "food", title: "黑門市場", desc: "早午餐吃海鮮", icon: "utensils", nav: "Kuromon Ichiba Market" },
                    { time: "11:15", type: "sight", title: "固力果跑跑人", desc: "道頓堀地標", icon: "camera", nav: "Glico Man Sign" },
                    { time: "11:30", type: "shop", title: "心齋橋筋商店街", desc: "藥妝、服飾", icon: "shopping-bag", nav: "Shinsaibashi-Suji" },
                    { time: "13:00", type: "food", title: "牛かつもと村", desc: "難波御堂筋店 | 炸牛排", icon: "utensils", nav: "Gyukatsu Motomura Namba Midosuji", tags: ["排隊名店"] },
                    { time: "14:00", type: "food", title: "章魚燒道樂 Wanaka", desc: "道頓堀店", icon: "utensils", nav: "Takoyaki Wanaka Dotonbori" },
                    { time: "14:15", type: "sight", title: "御津八幡宮", desc: "美國村守護神", icon: "map-pin", nav: "Mitsu Hachimangu" },
                    { time: "14:45", type: "shop", title: "大丸心齋橋 / POP MART", desc: "本館 & PARCO", icon: "shopping-bag", nav: "Daimaru Shinsaibashi", tags: ["必逛"] },
                    { time: "16:30", type: "shop", title: "美國村古著巡禮", desc: "Kinji / Kindal / どないや", icon: "shirt", nav: "Americamura", tags: ["古著"] },
                    { time: "18:00", type: "shop", title: "相機的大林", desc: "Camera no Ohbayashi", icon: "camera", nav: "Camera no Ohbayashi" },
                    { time: "18:40", type: "shop", title: "阪急三番街 & 古著屋JAM", desc: "梅田茶屋町店", icon: "shopping-bag", nav: "Hankyu Sanbangai" },
                    { time: "20:10", type: "shop", title: "HEP FIVE", desc: "紅色摩天輪", icon: "shopping-bag", nav: "HEP FIVE" },
                    { time: "21:00", type: "food", title: "燒肉力丸", desc: "梅田東通店 | 吃到飽", icon: "utensils", nav: "Yakiniku Rikimaru Umeda Higashi", tags: ["推薦"] }
                ] 
            },
            "Day 3": { 
                date: "1/13 (Tue)", 
                area: "移動 -> 京都", 
                weather: "☁ 4-8°C", 
                events: [ 
                    { time: "09:00", type: "sight", title: "大阪城", desc: "晨間散步", icon: "camera", nav: "Osaka Castle" },
                    { time: "10:00", type: "hotel", title: "Check-in: Vista Premio", desc: "京都和邸 | 寄放行李", icon: "hotel", nav: "Hotel Vista Premio Kyoto Nagomitei", tags: ["住宿"] },
                    { time: "11:15", type: "food", title: "三嶋亭 (高島屋店)", desc: "百年壽喜燒老店", icon: "utensils", nav: "Mishima-tei Takashimaya Kyoto", tags: ["必吃"] },
                    { time: "12:45", type: "sight", title: "嵐山半日遊", desc: "常寂光寺/竹林/野宮神社/天龍寺", icon: "map", nav: "Arashiyama Bamboo Grove", tags: ["必拍"] },
                    { time: "17:00", type: "shop", title: "河原町購物", desc: "Pokemon / Marimekko / SOU・SOU / North Face", icon: "shopping-bag", nav: "Shijo Kawaramachi" },
                    { time: "20:00", type: "shop", title: "Animate Kyoto", desc: "動漫周邊", icon: "gift", nav: "Animate Kyoto" },
                    { time: "21:00", type: "food", title: "一蘭拉麵", desc: "京都河原町店", icon: "utensils", nav: "Ichiran Kyoto Kawaramachi" }
                ] 
            },
            "Day 4": { 
                date: "1/14 (Wed)", 
                area: "京都深度遊", 
                weather: "⛅ 7°C", 
                events: [ 
                    { time: "07:30", type: "sight", title: "清水寺", desc: "早起避開人潮", icon: "camera", nav: "Kiyomizu-dera", tags: ["必去"] },
                    { time: "09:30", type: "shop", title: "清水坂/產寧坂", desc: "MALEBRANCHE / 七味家 / 烏丸六七堂", icon: "shopping-bag", nav: "Malebranche Kiyomizuzaka", tags: ["伴手禮"] },
                    { time: "11:30", type: "sight", title: "八阪庚申堂 & 八阪神社", desc: "色彩繽紛結緣猴", icon: "camera", nav: "Yasaka Koshin-do" },
                    { time: "12:30", type: "food", title: "祇園 鰻 川藤", desc: "午餐：鰻魚飯", icon: "utensils", nav: "Gion Unagi Kawatō" },
                    { time: "13:30", type: "shop", title: "Miffy's Kitchen", desc: "米飛兔麵包 & 白川散步", icon: "rabbit", nav: "Miffy's Kitchen Gion" },
                    { time: "14:30", type: "sight", title: "下鴨神社", desc: "森林中的神社", icon: "tree", nav: "Shimogamo Shrine" },
                    { time: "16:30", type: "shop", title: "河原町雜貨巡禮", desc: "HUMAN MADE / ANGERS / MoMA / Today's Special", icon: "shopping-bag", nav: "Angers Kawaramachi", tags: ["必逛"] },
                    { time: "20:00", type: "food", title: "六角ace", desc: "人氣居酒屋", icon: "utensils", nav: "Rokkaku Ace", tags: ["推薦"] }
                ] 
            },
            "Day 5": { 
                date: "1/15 (Thu)", 
                area: "返程", 
                weather: "☀ 8°C", 
                events: [ 
                    { time: "07:00", type: "sight", title: "伏見稻荷大社", desc: "千本鳥居 | 早晨人少", icon: "camera", nav: "Fushimi Inari Taisha", tags: ["必拍"] },
                    { time: "10:00", type: "sight", title: "御金神社", desc: "洗錢求財運", icon: "dollar-sign", nav: "Mikane Shrine" },
                    { time: "11:00", type: "food", title: "麵屋優光", desc: "貝類高湯拉麵", icon: "utensils", nav: "Menya Yukou", tags: ["排隊"] },
                    { time: "12:00", type: "transport", title: "利木津巴士", desc: "前往關西機場", icon: "bus", nav: "Kyoto Station Hachijoguchi Bus Stop" },
                    { time: "16:15", type: "transport", title: "航班起飛", desc: "Goodbye Japan!", icon: "plane" }
                ] 
            }
        };

        const hotelInfos = [
            { name: "ホテル京阪淀屋橋", date: "1/11-1/13", address: "大阪市中央區北濱2-4-6", tel: "06-6229-0321", nav: "Hotel Keihan Yodoyabashi" },
            { name: "ホテルビスタプレミオ京都 和邸", date: "1/13-1/15", address: "京都市中京區六角通新町西入", tel: "075-252-1666", nav: "Hotel Vista Premio Kyoto Nagomitei" }
        ];

        // --- Helper Components ---
        const Icon = ({ name, size = 18, className }) => {
            // Mapping strings to Lucide icons
            if (name === 'plane') return <i data-lucide="plane" className={className}></i>;
            if (name === 'hotel') return <i data-lucide="bed-double" className={className}></i>;
            if (name === 'shopping-bag') return <i data-lucide="shopping-bag" className={className}></i>;
            if (name === 'coffee') return <i data-lucide="coffee" className={className}></i>;
            if (name === 'utensils') return <i data-lucide="utensils" className={className}></i>;
            if (name === 'gift') return <i data-lucide="gift" className={className}></i>;
            if (name === 'book') return <i data-lucide="book-open" className={className}></i>;
            if (name === 'moon') return <i data-lucide="moon" className={className}></i>;
            if (name === 'camera') return <i data-lucide="camera" className={className}></i>;
            if (name === 'map-pin') return <i data-lucide="map-pin" className={className}></i>;
            if (name === 'shirt') return <i data-lucide="shirt" className={className}></i>;
            if (name === 'map') return <i data-lucide="map" className={className}></i>;
            if (name === 'rabbit') return <i data-lucide="smile" className={className}></i>;
            if (name === 'tree') return <i data-lucide="trees" className={className}></i>;
            if (name === 'dollar-sign') return <i data-lucide="banknote" className={className}></i>;
            if (name === 'bus') return <i data-lucide="bus" className={className}></i>;
            return <i data-lucide="circle" className={className}></i>;
        };

        // --- Main App ---
        const App = () => {
            const [selectedDay, setSelectedDay] = useState("Day 1");
            const [activeTab, setActiveTab] = useState("schedule"); // schedule, info

            useEffect(() => {
                lucide.createIcons();
            }, [selectedDay, activeTab]);

            const handleNav = (loc) => {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc)}&travelmode=driving`, '_blank');
            };

            const Tag = ({ text }) => {
                let color = "bg-slate-700 text-slate-300"; // default
                if (["必吃", "必買", "必去", "必拍", "住宿"].includes(text)) color = "bg-rose-500/20 text-rose-300 border border-rose-500/30";
                if (["排隊", "預約", "排隊名店"].includes(text)) color = "bg-amber-500/20 text-amber-300 border border-amber-500/30";
                if (["伴手禮", "古著", "推薦"].includes(text)) color = "bg-cyan-500/20 text-cyan-300 border border-cyan-500/30";
                
                return (
                    <span className={`text-[10px] px-2 py-0.5 rounded-full mr-1 ${color}`}>
                        {text}
                    </span>
                );
            };

            const renderSchedule = () => (
                <div className="pb-24 animate-fade-in">
                    {/* Header */}
                    <div className="sticky top-0 z-20 bg-[#0f172a]/95 backdrop-blur-md pt-4 pb-2 px-4 border-b border-slate-800">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h1 className="text-2xl font-extrabold text-gradient tracking-tight">2026 京阪行</h1>
                                <p className="text-xs text-slate-400 mt-1">1/11 - 1/15 Travel Plan</p>
                            </div>
                            <div className="text-right">
                                <div className="text-lg font-bold text-white">{itineraryData[selectedDay].weather.split(' ')[0]}</div>
                                <div className="text-xs text-slate-400">{itineraryData[selectedDay].weather.split(' ')[1]}</div>
                            </div>
                        </div>

                        {/* Day Tabs */}
                        <div className="flex space-x-3 overflow-x-auto hide-scrollbar pb-2">
                            {Object.keys(itineraryData).map(day => (
                                <button 
                                    key={day}
                                    onClick={() => setSelectedDay(day)}
                                    className={`flex-shrink-0 px-4 py-2 rounded-xl transition-all duration-300 ${
                                        selectedDay === day 
                                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30 scale-105 font-bold' 
                                        : 'bg-slate-800 text-slate-400 border border-slate-700'
                                    }`}
                                >
                                    <span className="block text-xs opacity-60 uppercase tracking-wide">{day}</span>
                                    <span className="text-sm">{itineraryData[day].date.split(' ')[0]}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Events */}
                    <div className="px-4 mt-6 space-y-6 relative">
                         {itineraryData[selectedDay].events.map((event, index) => {
                             const isLast = index === itineraryData[selectedDay].events.length - 1;
                             return (
                                <div key={index} className={`relative pl-14 ${isLast ? 'last-item' : ''}`}>
                                    {/* Timeline Line */}
                                    <div className="timeline-line"></div>
                                    
                                    {/* Time Bubble */}
                                    <div className="absolute left-0 top-0 flex flex-col items-center z-10">
                                        <div className="bg-slate-800 border-2 border-slate-700 text-slate-300 text-[10px] font-bold px-2 py-1 rounded-lg mb-1 shadow-sm">
                                            {event.time}
                                        </div>
                                        {/* Icon Dot */}
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center border-2 shadow-lg ${
                                            event.type === 'food' ? 'bg-orange-900/80 border-orange-500 text-orange-400' :
                                            event.type === 'shop' ? 'bg-pink-900/80 border-pink-500 text-pink-400' :
                                            event.type === 'transport' ? 'bg-blue-900/80 border-blue-500 text-blue-400' :
                                            event.type === 'hotel' ? 'bg-purple-900/80 border-purple-500 text-purple-400' :
                                            'bg-emerald-900/80 border-emerald-500 text-emerald-400'
                                        }`}>
                                            <Icon name={event.icon} size={14} />
                                        </div>
                                    </div>

                                    {/* Card */}
                                    <div className="glass-card rounded-2xl p-4 active:scale-[0.98] transition-transform duration-200">
                                        <div className="flex justify-between items-start">
                                            <div className="flex-1">
                                                <h3 className="text-lg font-bold text-slate-100 mb-1 leading-tight">{event.title}</h3>
                                                <p className="text-sm text-slate-400 mb-3">{event.desc}</p>
                                                
                                                {/* Tags */}
                                                {event.tags && (
                                                    <div className="flex flex-wrap gap-y-2 mb-3">
                                                        {event.tags.map((tag, i) => <Tag key={i} text={tag} />)}
                                                    </div>
                                                )}
                                            </div>
                                            
                                            {/* Big Nav Button for Driving */}
                                            {event.nav && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); handleNav(event.nav); }}
                                                    className="ml-2 flex-shrink-0 w-12 h-12 bg-blue-600 rounded-xl flex flex-col items-center justify-center text-white shadow-lg shadow-blue-600/30 active:bg-blue-700"
                                                >
                                                    <i data-lucide="navigation" className="w-5 h-5 mb-0.5"></i>
                                                    <span className="text-[8px] font-bold">GO</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                             );
                         })}
                    </div>
                </div>
            );

            const renderInfo = () => (
                <div className="px-4 py-8 pb-24">
                    <h2 className="text-2xl font-bold text-white mb-6">旅程資訊</h2>
                    
                    {/* Hotel Cards */}
                    <div className="space-y-4 mb-8">
                        {hotelInfos.map((hotel, i) => (
                            <div key={i} className="glass-card p-5 rounded-2xl border-l-4 border-purple-500">
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <h3 className="font-bold text-lg text-white">{hotel.name}</h3>
                                        <p className="text-xs text-purple-300 mt-1">{hotel.date}</p>
                                    </div>
                                    <button onClick={() => handleNav(hotel.nav)} className="bg-slate-700 p-2 rounded-lg text-slate-300">
                                        <i data-lucide="map" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <p className="text-sm text-slate-400 mb-1">{hotel.address}</p>
                                <p className="text-sm text-slate-500">Tel: {hotel.tel}</p>
                            </div>
                        ))}
                    </div>

                    {/* Emergency / Tools */}
                    <div className="grid grid-cols-2 gap-4">
                        <div className="glass-card p-4 rounded-xl flex flex-col items-center justify-center py-6">
                            <i data-lucide="phone-call" className="w-8 h-8 text-rose-500 mb-2"></i>
                            <span className="text-slate-300 font-bold">110 / 119</span>
                            <span className="text-xs text-slate-500">緊急電話</span>
                        </div>
                        <div className="glass-card p-4 rounded-xl flex flex-col items-center justify-center py-6">
                            <i data-lucide="train" className="w-8 h-8 text-emerald-500 mb-2"></i>
                            <span className="text-slate-300 font-bold">換乘案內</span>
                            <span className="text-xs text-slate-500">交通查詢</span>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    {activeTab === 'schedule' ? renderSchedule() : renderInfo()}

                    {/* Bottom Nav */}
                    <div className="fixed bottom-6 left-6 right-6 h-16 bg-[#1e293b]/90 backdrop-blur-xl border border-slate-700 rounded-2xl flex justify-around items-center shadow-2xl z-50">
                        <button 
                            onClick={() => setActiveTab('schedule')}
                            className={`flex flex-col items-center space-y-1 w-full h-full justify-center rounded-l-2xl ${activeTab === 'schedule' ? 'text-blue-400' : 'text-slate-500'}`}
                        >
                            <i data-lucide="calendar-days" className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium">行程</span>
                        </button>
                        <div className="w-px h-8 bg-slate-700"></div>
                        <button 
                            onClick={() => setActiveTab('info')}
                            className={`flex flex-col items-center space-y-1 w-full h-full justify-center rounded-r-2xl ${activeTab === 'info' ? 'text-blue-400' : 'text-slate-500'}`}
                        >
                            <i data-lucide="info" className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium">資訊</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
